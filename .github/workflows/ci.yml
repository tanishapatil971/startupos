name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    env:
      # Safe CI placeholders for build-time public variables.
      # These are NOT secrets — NEXT_PUBLIC_* vars are embedded in the
      # client bundle and are visible to all users in production anyway.
      # Real values are configured in Vercel for deployment.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # Server-side vars needed at build time (not exposed to client)
      GEMINI_API_KEY: placeholder
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Run production build
        run: npm run build
